[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repopulse-api"
version = "0.1.0"
description = "RepoPulse HTTP API service"
requires-python = ">=3.11"
dependencies = [
    # repopulse-contracts is a local sibling package.
    # Install it first: pip install -e ../../packages/contracts
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pika>=1.3.2",
    "psycopg2-binary>=2.9.9",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",       # Required by FastAPI's TestClient
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
