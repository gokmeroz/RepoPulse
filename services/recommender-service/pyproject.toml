[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repopulse-recommender"
version = "0.1.0"
description = "RepoPulse recommender worker service"
requires-python = ">=3.11"
dependencies = [
    # repopulse-contracts is a local sibling package.
    # Install it first: pip install -e ../../packages/contracts
    "pika>=1.3.2",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "psycopg2-binary>=2.9.9",
    # ML deps added in v0.4.0 and v0.5.0:
    # "numpy>=1.26.0",
    # "torch>=2.2.0",
    # "sentence-transformers>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
