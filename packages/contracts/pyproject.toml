[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repopulse-contracts"
version = "0.1.0"
description = "Shared message schemas for RepoPulse services"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["repopulse_contracts"]
